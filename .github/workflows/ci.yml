name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leadflow_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leadflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leadflow_ci
      E2E_TEST_MODE: "1"
      NEXT_PUBLIC_E2E_TEST_MODE: "1"
      E2E_USER_ID: e2e-user
      E2E_TEST_SECRET: leadflow-ci-e2e-secret
      # Valid but inert: E2E test mode bypasses Clerk, while Next still checks
      # the publishable-key format during startup.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bGVhZC1mbG93LWUyZS0xLmNsZXJrLmFjY291bnRzLmRldiQ=
      CLERK_SECRET_KEY: sk_test_ci_dummy
      ARCJET_KEY: ajkey_ci_e2e_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run database integration tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leadflow_ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test
        env:
          # The job enables the local auth bypass for Playwright. Keep that
          # mode out of unit tests so they exercise normal server behavior.
          E2E_TEST_MODE: "0"
          NEXT_PUBLIC_E2E_TEST_MODE: "0"

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
